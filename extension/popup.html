<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus Modlist Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Nexus Modlist Downloader</h1>
        <p>Sequential Nexus download automation</p>
      </div>
      <span id="count">0 URL(s)</span>
    </header>

    <label for="list">Mod list</label>
    <textarea id="list" spellcheck="false" placeholder='["https://www.nexusmods.com/game/mods/123"]'></textarea>

    <label for="method">Download method</label>
    <select id="method">
      <option value="vortex">Vortex</option>
      <option value="manual">Manual</option>
      <option value="manual-urlgrab">Manual (URL Grab)</option>\n      <option value="gateway">Gateway</option>
    </select>

    <div class="row">
      <button id="load" class="secondary">Load example</button>
      <button id="start">Start</button>
      <button id="stop" class="danger">Stop</button>
    </div>

    <label for="gatewayUrl">Gateway URL</label>\n    <input id="gatewayUrl" type="text" value="http://127.0.0.1:8765" spellcheck="false">\n\n    <div id="status">Idle</div>
    <label for="captured">Captured URLs</label>
    <textarea id="captured" readonly placeholder="Captured URLs are also sent to Gateway when Gateway mode is selected."></textarea>
    <div class="row">
      <button id="copyCaptured" class="secondary">Copy captured URLs</button>
    </div>

    <pre id="log"></pre>
  </main>

  <script src="popup.js"></script>
</body>
</html>
